<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Encouragement with Pastor London</title>
<meta name="theme-color" content="#1b2140">
<meta name="description" content="Daily Encouragement with Pastor London — sermons, short videos, audio, articles, prayer requests, testimonies, programmes and events.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Encouragement">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2140; --ink2:#3a4266; --muted:#6b7090; --line:#e8e2d6;
  --bg:#faf7f1; --card:#ffffff; --gold:#b9852f; --gold2:#e9c98a; --goldbg:#fbf3e3;
  --rose:#9b3d4a; --green:#2f6e5a; --radius:16px;
  --shadow:0 1px 2px rgba(27,33,64,.05),0 6px 20px rgba(27,33,64,.06);
  --serif:"Cormorant Garamond",Georgia,serif; --sans:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.2px;margin:0;line-height:1.15}
h1{font-size:2.4rem} h2{font-size:1.75rem} h3{font-size:1.3rem}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* Shell */
.shell{display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;background:var(--ink);color:#e9e7f2;position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo{width:58px;height:58px;flex-shrink:0;display:grid;place-items:center}
.logo>svg{width:58px;height:58px;display:block}
.side .brand{flex-direction:column;align-items:center;text-align:center;gap:12px;padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.side .logo,.side .logo>svg{width:104px;height:104px}
.side .brand b{font-size:1.3rem}
.side .brand span{display:block;margin-top:4px;line-height:1.4}
.brand b{font-family:var(--serif);font-size:1.25rem;font-weight:700;line-height:1.1;display:block}
.brand span{font-size:.72rem;opacity:.65}
.navgroup{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.45;padding:14px 10px 4px}
.navlink{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;text-decoration:none;font-size:.92rem;opacity:.85;border:0;background:none;width:100%;text-align:left}
.navlink svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.navlink:hover{background:rgba(255,255,255,.07);opacity:1}
.navlink.on{background:rgba(233,201,138,.16);color:var(--gold2);opacity:1}
.main{flex:1;min-width:0}
.topbar{display:none}
.content{max-width:1120px;margin:0 auto;padding:32px 32px 80px}
.bottomnav{display:none}

@media (max-width:900px){
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:rgba(250,247,241,.92);backdrop-filter:blur(10px);padding:12px 16px;border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0}
  .topbar .logo,.topbar .logo>svg{width:44px;height:44px}
  .topbar .brand b{color:var(--ink);font-size:1.15rem}
  .topbar .brand span{color:var(--muted);opacity:1}
  .content{padding:18px 16px 110px}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--muted);padding:6px 0}
  .bottomnav button svg{width:22px;height:22px}
  .bottomnav button.on{color:var(--gold)}
  h1{font-size:1.9rem}
}

/* Cards & UI */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.section{margin-top:34px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 18px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:.9rem;text-decoration:none;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:var(--ink2)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--gold);padding:6px 4px}
.btn.sm{padding:6px 12px;font-size:.8rem}
.btn.danger{color:var(--rose)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:.84rem;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--goldbg);color:#8a6220}
.tag.green{background:#e6f2ec;color:var(--green)} .tag.rose{background:#f7e8ea;color:var(--rose)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.82rem;font-weight:600;color:var(--ink2)}
.input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;outline:none}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,133,47,.15)}
textarea.input{min-height:110px;resize:vertical}
.search{position:relative;flex:1;min-width:180px}
.search input{padding-left:38px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;margin-bottom:10px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--gold)}
.note{background:var(--goldbg);border:1px solid #f0e0bd;border-radius:12px;padding:12px 14px;font-size:.86rem;color:#6b4c18}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:40px;min-height:290px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--ink)}
.hero .bgart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.95}
.hero>*:not(.bgart){position:relative}
.hero h1{font-size:2.8rem;max-width:620px}
.hero p{max-width:560px;opacity:.88;margin:10px 0 20px}
.hero .btn{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(6px)}
.hero .btn.gold{background:var(--gold);border-color:var(--gold)}
@media (max-width:560px){.hero{padding:24px;min-height:340px}.hero h1{font-size:2rem}}
.hero>a.livebtn{position:absolute;top:20px;right:20px;display:inline-flex;align-items:center;gap:9px;background:#e1251b;color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;letter-spacing:.04em;padding:10px 16px 10px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(225,37,27,.45);transition:transform .15s,background .15s;z-index:2}
.hero>a.livebtn:hover{background:#c41e15;transform:translateY(-1px)}
.livebtn .pulse{width:9px;height:9px;border-radius:50%;background:#fff;position:relative;flex-shrink:0}
.livebtn .pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #fff;opacity:.8;animation:pulse 1.6s ease-out infinite}
.livebtn svg{width:16px;height:16px}
@keyframes pulse{from{transform:scale(.6);opacity:.9}to{transform:scale(1.6);opacity:0}}
@media (max-width:560px){.hero{padding-top:72px}.hero>a.livebtn{top:16px;right:16px;padding:8px 13px 8px 12px;font-size:.78rem}}
.nextsvc{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-size:.8rem;margin-bottom:14px;backdrop-filter:blur(6px)}
.dot{width:8px;height:8px;border-radius:50%;background:#7be0a6;display:inline-block}

/* Media cards */
.media{cursor:pointer;overflow:hidden;border-radius:var(--radius);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s}
.media:hover{transform:translateY(-2px)}
.thumb{position:relative;aspect-ratio:16/9;background:#ddd;overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.thumb .play svg{width:20px;height:20px;color:var(--ink);margin-left:3px}
.thumb .dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:6px}
.media .meta{padding:13px 15px 15px}
.media .meta b{display:block;font-size:.98rem;line-height:1.3;margin-bottom:4px}
.shorts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.short{cursor:pointer;position:relative;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#222;box-shadow:var(--shadow)}
.short img,.short video{width:100%;height:100%;object-fit:cover}
.short .cap{position:absolute;inset:auto 0 0 0;padding:40px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:.85rem;font-weight:600;line-height:1.25}
.short .play{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center}
.short .play svg{width:12px;height:12px;color:var(--ink);margin-left:2px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.featured{display:grid;grid-template-columns:1.3fr 1fr;overflow:hidden}
.featured .thumb{aspect-ratio:auto;min-height:260px}
@media (max-width:760px){.featured{grid-template-columns:1fr}.featured .thumb{min-height:200px}}

/* Lists */
.list>*{border-bottom:1px solid var(--line)} .list>*:last-child{border-bottom:0}
.trow{display:flex;gap:14px;align-items:center;padding:13px 16px}
.pbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;flex-shrink:0}
.pbtn svg{width:16px;height:16px;margin-left:2px}
.pbtn.on{background:var(--gold)}
.trow .t{flex:1;min-width:0}
.trow .t b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evdate{width:56px;flex-shrink:0;text-align:center;border-radius:12px;background:var(--goldbg);padding:6px 0;line-height:1.1}
.evdate b{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--ink)}
.evdate span{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:#8a6220;font-weight:600}

/* Quick tiles */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media (max-width:480px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.8rem;font-weight:600;text-align:center}
.tile:hover{border-color:var(--gold)}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--goldbg);color:var(--gold);display:grid;place-items:center}
.tile .ic svg{width:20px;height:20px}

/* Verse */
.verse{background:linear-gradient(135deg,#fff 0%,var(--goldbg) 100%);border:1px solid #f0e0bd}
.verse q{font-family:var(--serif);font-size:1.45rem;line-height:1.35;display:block;quotes:"\201C" "\201D";margin:8px 0}

/* Gallery */
.gallery{columns:3 220px;column-gap:14px}
.gallery figure{margin:0 0 14px;break-inside:avoid;border-radius:14px;overflow:hidden;cursor:pointer;position:relative;background:#eee}
.gallery img{width:100%;display:block}
.gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;color:#fff;font-size:.8rem;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .2s}
.gallery figure:hover figcaption{opacity:1}

/* Prayer wall */
.pcard{padding:18px;border-left:4px solid var(--gold)}
.pcard p{margin:8px 0 12px;white-space:pre-wrap}
.prayed{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.8rem;display:inline-flex;gap:6px;align-items:center}
.prayed.on{background:var(--goldbg);border-color:var(--gold2);color:#8a6220}
.prayed svg{width:14px;height:14px}

/* Testimony */
.tcard{padding:22px;position:relative}
.tcard .qm{font-family:var(--serif);font-size:4rem;line-height:.6;color:var(--gold2);height:26px}
.tcard p{white-space:pre-wrap}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal .d{min-height:86px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left}
.cal .d.out{opacity:.4}
.cal .d.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal .d.sel{background:var(--goldbg)}
.cal .d .n{font-size:.8rem;font-weight:600}
.cal .ev{font-size:.66rem;line-height:1.2;padding:2px 5px;border-radius:5px;background:#eef0f7;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.sp{background:var(--goldbg);color:#8a6220}
.cal .more{font-size:.65rem;color:var(--muted)}
@media (max-width:640px){.cal .d{min-height:54px;padding:4px}.cal .ev{display:none}.cal .d .dots{display:flex}.cal .more{display:none}}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink2)}
.dots i.sp{background:var(--gold)}

/* Programs */
.daycol h3{font-size:1.15rem;margin-bottom:8px}
.prog{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prog:first-of-type{border-top:0}
.prog .tm{width:76px;flex-shrink:0;font-weight:600;font-size:.84rem;color:var(--gold)}

/* About */
.bio{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
.bio img{width:100%;border-radius:18px;display:block}
@media (max-width:760px){.bio{grid-template-columns:1fr}.bio img{max-width:240px}}
.prose p{margin:0 0 14px}
.prose h2,.prose h3{margin:22px 0 10px}
.leader{display:flex;gap:12px;align-items:center;padding:14px}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex-shrink:0;font-size:.9rem}

/* Modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,18,36,.62);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.modal .box{background:#fff;border-radius:20px;max-width:820px;width:100%;max-height:92vh;overflow:auto;position:relative}
.modal .box.wide{max-width:1000px}
.modal .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.modal .x svg{width:16px;height:16px}
.modal video{width:100%;display:block;background:#000;max-height:70vh}
.modal .vert video{max-height:80vh;width:auto;margin:0 auto}
.lightbox{background:transparent!important;max-width:1000px}
.lightbox img{max-width:100%;max-height:80vh;display:block;margin:0 auto;border-radius:12px}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);display:grid;place-items:center}
.lbnav svg{width:18px;height:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:560px){.modal{padding:0;align-items:flex-end}.modal .box{border-radius:20px 20px 0 0;max-height:94vh}}

/* Mini player */
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:40;width:min(560px,calc(100% - 24px));background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.player audio{flex:1;height:36px;min-width:0}
.player b{font-size:.85rem;display:block;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .x2{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:50%;width:30px;height:30px;flex-shrink:0}
@media (max-width:900px){.player{bottom:78px}}

.wafab{position:fixed;right:22px;bottom:22px;z-index:35;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(37,211,102,.45);text-decoration:none;transition:transform .15s}
.wafab:hover{transform:scale(1.06)}
.wafab svg{width:30px;height:30px}
.wafab .tip{position:absolute;right:66px;white-space:nowrap;background:#fff;color:var(--ink);font-size:.8rem;font-weight:600;padding:7px 12px;border-radius:10px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .15s}
.wafab:hover .tip{opacity:1}
@media (max-width:900px){.wafab{bottom:84px;right:16px;width:52px;height:52px}}
.fbwrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;justify-content:center}
.fbbtn{background:#1877f2!important;border-color:#1877f2!important;color:#fff!important}
.ttwrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-height:200px}
.ttbtn{background:#111!important;border-color:#111!important;color:#fff!important}
.embed169{position:relative;aspect-ratio:16/9;background:#000}.embed169 iframe,.embedtt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embedtt{position:relative;width:min(340px,100%);aspect-ratio:9/16.5;margin:0 auto;background:#000}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:200;font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
@media (max-width:900px){.toast{bottom:90px}}

/* Sheet (mobile More) */
.sheetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px}

/* Admin */
.admintabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.admintabs button{border:0;background:none;padding:10px 14px;font-weight:600;font-size:.88rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.admintabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.arow{display:flex;gap:12px;align-items:center;padding:10px 14px}
.arow img{width:64px;height:40px;object-fit:cover;border-radius:6px;flex-shrink:0}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>

  {type:'article', title:'Five Ways to Build a Daily Prayer Habit', speaker:'Pastor London', date:ago(2), category:'Spiritual Growth', desc:'Prayer is less about finding perfect words and more about showing up. Here are simple, practical ways to begin.',
   body:'Many of us want to pray more but struggle to make it a daily rhythm. The good news is that prayer is not a performance; it is a conversation with a Father who delights to hear from His children.\n\n1. Pick a time and a place. Jesus often withdrew to quiet places to pray (Luke 5:16). Choose a regular moment — before breakfast, on your commute, or before bed — and attach prayer to it.\n\n2. Start small. Five honest minutes are better than an hour you never begin. Let it grow naturally.\n\n3. Use a simple pattern. Try ACTS: Adoration, Confession, Thanksgiving and Supplication. It keeps your prayers balanced and focused on God, not only on needs.\n\n4. Pray Scripture. Read a psalm slowly and turn each verse into a prayer. God\'s Word teaches us how to talk to Him.\n\n5. Keep a prayer journal. Write down requests and record answers. Over time you will have a written testimony of God\'s faithfulness.\n\nMost of all, be patient with yourself. Prayer is a relationship, and relationships grow with time.'},
  {type:'article', title:'What Happens at Baptism?', speaker:'Pastor London', date:ago(9), category:'Foundations', desc:'Baptism is a public declaration of an inward change. Here is what it means and how to take the next step.',
   body:'Baptism is one of the most joyful moments in the life of our church. It is an outward picture of an inward reality: that a person has turned from sin and put their trust in Jesus Christ.\n\nIn Romans 6:4 Paul writes that we were buried with Christ through baptism, so that just as Christ was raised from the dead, we too may live a new life. Going under the water pictures dying to the old life; coming up pictures new life in Him.\n\nBaptism does not save us — Jesus does. But it is an act of obedience and a public testimony before family, friends and the church family.\n\nIf you have recently given your life to Christ, or you have been following Jesus but have never been baptised, we would love to talk with you. Join our next Foundations class, where we cover the basics of faith and prepare for Baptism Sunday.'},
  {type:'article', title:'Raising Children Who Love God', speaker:'Deaconess Mary Phiri', date:ago(16), category:'Family', desc:'Faith is caught as much as it is taught. Practical encouragement for parents and guardians.',
   body:'Deuteronomy 6 tells parents to talk about God\'s commands when they sit at home, walk along the road, lie down and get up. In other words, faith is meant to be woven into ordinary life.\n\nChildren notice how we speak, how we forgive and how we handle disappointment. When they see us pray in hard times and give thanks in good times, they learn that God is real and present.\n\nA few ideas to try this month: read a short Bible story together at bedtime; pray for one family member or friend at dinner; let children see you serve others; and celebrate answered prayers together.\n\nOur Children\'s Church team is here to partner with you. Together we can help the next generation know and love Jesus.'},
  {type:'article', title:'Serving Our City: Outreach Report', speaker:'Deacon Peter Nkosi', date:ago(23), category:'Outreach', desc:'A look back at this quarter\'s food drives, hospital visits and community clean-up days.',
   body:'This quarter our outreach team and volunteers served more families than ever before. Food parcels were packed and delivered, hospital visitation teams prayed with patients each week, and dozens of members joined our community clean-up days.\n\nThank you to everyone who gave, packed, drove and prayed. Jesus said that whatever we do for the least of these, we do for Him (Matthew 25:40).\n\nThere are many ways to get involved next quarter. Speak to the outreach desk after any Sunday service or send us a message through the app.'},

function parseLines(s, n){ return String(s||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const p = l.split('|').map(x=>x.trim()); while(p.length<n) p.push(''); return p; }); }
function weeklyAll(){ return [...WEEKLY, ...S.dbItems.filter(x=>x.type==='weekly').map(x=>({day:+x.day, time:x.time, title:x.title, location:x.location, id:x.id}))]; }
function timeVal(t){ const m = String(t||'').match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i); if(!m) return 9999; let h=+m[1]; const mi=+(m[2]||0); const ap=(m[3]||'').toUpperCase(); if(ap==='PM'&&h<12)h+=12; if(ap==='AM'&&h===12)h=0; return h*60+mi; }

function eventsOn(d){
  const s = iso(d), dow = d.getDay(), out = [];
  allItems().filter(x=>x.type==='event' && x.date===s).forEach(x=>out.push({...x, special:true}));
  weeklyAll().filter(w=>w.day===dow).forEach(w=>out.push({title:w.title, time:w.time, location:w.location, weekly:true}));
  const nth = Math.ceil(d.getDate()/7), isLast = addDays(d,7).getMonth() !== d.getMonth();
  MONTHLY.forEach(m=>{ if (m.day!==dow) return; if ((m.rule==='first'&&nth===1)||(m.rule==='second'&&nth===2)||(m.rule==='last'&&isLast)) out.push({title:m.title, time:m.time, monthly:true, special:true}); });
  return out.sort((a,b)=>timeVal(a.time)-timeVal(b.time));
}
function upcomingSpecial(days=45, max=5){
  const out = [];
  for (let i=0;i<days && out.length<max;i++){ const d = addDays(TODAY,i); eventsOn(d).filter(e=>e.special).forEach(e=>{ if(out.length<max) out.push({...e, date:iso(d)}); }); }
  return out;
}
function nextService(){
  const svcs = parseLines(S.settings.services, 3);
  const now = new Date();
  for (let i=0;i<8;i++){
    const d = addDays(TODAY,i);
    const list = svcs.filter(s => s[0].toLowerCase().startsWith(DAYS[d.getDay()].toLowerCase().slice(0,3))).sort((a,b)=>timeVal(a[1])-timeVal(b[1]));
    for (const s of list){ const t = timeVal(s[1]); const when = new Date(d); when.setMinutes(t); if (when > now) return {label:s[2]||'Service', when, day:i===0?'Today':i===1?'Tomorrow':DAYS[d.getDay()], time:s[1]}; }
  }
  return null;
}

function adminForm(t){

  if (['sermon','short','audio','article'].includes(t)) h += f('speaker', t==='article'?'Author':'Speaker / minister');
  if (['sermon','short','audio','article','photo','event'].includes(t)) h += f('date', t==='event'?'Event date':'Date', 'date', '', t==='event');
  if (t==='sermon') h += f('series','Series','text','e.g. Anchored') + f('scripture','Scripture','text','e.g. John 3:16');
  if (['sermon','short','audio'].includes(t)) h += f('duration','Length','text','e.g. 45:10');
  if (['audio','article'].includes(t)) h += f('category','Category','text', t==='audio'?'Sermon, Worship, Devotional':'Family, Foundations…');

  if (t==='article') h += `<div class="field"><label>Summary</label><input class="input" name="desc"></div><div class="field"><label>Article text</label><textarea class="input" name="body" style="min-height:200px" required></textarea></div>`;

function showPhoto(i){

async function refreshAuth(){
  if (!S.sb) return;
  const { data } = await S.sb.auth.getSession();
  S.session = data.session;
  S.canEdit = false;
  if (S.session) { const r = await S.sb.rpc('de_is_admin'); S.canEdit = !!r.data; }
}

/* ============================================================
   SUBMISSIONS (prayer, testimony)
   ============================================================ */
function messageFallback(kind, text, outEl){
  const st = S.settings;
  const wa = st.whatsapp ? `https://wa.me/${st.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(text)}` : '';
  const mail = st.email ? `mailto:${st.email}?subject=${encodeURIComponent(kind)}&body=${encodeURIComponent(text)}` : '';
  outEl.innerHTML = `<div class="note" style="margin-top:14px"><b>We couldn't send that just now.</b> ${wa||mail?'You can send it directly instead:':'Please copy it and try again later.'}
    <div class="row wrap" style="margin-top:10px">${wa?`<a class="btn sm primary" href="${wa}" target="_blank" rel="noopener">${ic('wa')}Send on WhatsApp</a>`:''}${mail?`<a class="btn sm" href="${mail}">${ic('mail')}Email</a>`:''}<button type="button" class="btn sm" data-act="copy" data-text="${esc(text)}">${ic('copy')}Copy message</button></div></div>`;
}
async function submitPrayer(form){
  const fd = new FormData(form);
  const isPrivate = !!fd.get('private');
  const row = {name:(fd.get('name')||'').trim().slice(0,100) || null, category:fd.get('category'), body:(fd.get('body')||'').trim().slice(0,3000), anon:!!fd.get('anon'), is_private:isPrivate};
  if (!row.body) return;
  const out = form.querySelector('#prayerOut'), btn = form.querySelector('button[type=submit]'); btn.disabled = true;
  const { error } = S.sb ? await S.sb.from('de_prayers').insert(row) : {error:true};
  btn.disabled = false;
  if (!error) {
    form.reset();
    out.innerHTML = `<div class="note" style="margin-top:14px;background:#e6f2ec;border-color:#cfe6da;color:var(--green)">Thank you — our prayer team has received your request${isPrivate?' privately':' and it is now on the prayer wall'}. 🙏</div>`;
    if (!isPrivate) setTimeout(loadAll, 1500);
  } else messageFallback('Prayer request', `Prayer request (${row.category})${isPrivate?' — please keep private':''}\nFrom: ${row.anon?'Anonymous':(row.name||'Anonymous')}\n\n${row.body}`, out);
}
function testimonyForm(){
  openModal(`<form class="pad" style="padding:28px" data-form="testimony"><h2 style="margin-bottom:6px">Share your testimony</h2><p class="muted small" style="margin-top:0">Your story will be reviewed by the pastoral team before it is published.</p>
    <div class="field"><label>Your name</label><input class="input" name="name" maxlength="100" required></div>
    <div class="field"><label>Title</label><input class="input" name="title" maxlength="200" placeholder="e.g. God provided a new job" required></div>
    <div class="field"><label>Your testimony</label><textarea class="input" name="body" maxlength="5000" style="min-height:160px" required></textarea></div>
    <label class="check"><input type="checkbox" name="consent" required> I agree for this testimony to be shared in the app</label>
    <button class="btn primary" type="submit">Submit testimony</button><div id="testOut"></div></form>`);
}
async function submitTestimony(form){
  const fd = new FormData(form);
  const t = {name:fd.get('name').trim(), title:fd.get('title').trim(), body:fd.get('body').trim()};
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
  const { error } = S.sb ? await S.sb.from('de_testimonies').insert(t) : {error:true};
  btn.disabled = false;
  if (!error) form.innerHTML = `<div class="empty"><div class="tile" style="border:0;display:inline-flex"><span class="ic">${ic('check')}</span></div><h2>Thank you!</h2><p>Your testimony has been sent for review.</p></div>`;
  else messageFallback('Testimony', `Testimony: ${t.title}\nFrom: ${t.name}\n\n${t.body}`, form.querySelector('#testOut'));
}

/* ============================================================
   ADMIN ACTIONS
   ============================================================ */
async function uploadFile(file, folder, bar){
  if (!file || !file.size) return null;
  if (file.size > 50*1024*1024) throw new Error(`"${file.name}" is larger than 50 MB. Compress it, or upload to YouTube and paste the link instead.`);
  if (bar) { bar.hidden = false; bar.firstElementChild.style.width = '35%'; }
  const safe = file.name.toLowerCase().replace(/[^a-z0-9.]+/g,'-').slice(-60);
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2,7)}-${safe}`;
  const { error } = await S.sb.storage.from(BUCKET).upload(path, file, {contentType:file.type || undefined, cacheControl:'31536000'});
  if (error) throw new Error('Upload failed: ' + error.message);
  if (bar) bar.firstElementChild.style.width = '100%';
  return path;
}
async function shrinkImage(file, max=2000){
  try {
    if (!/^image\/(jpeg|png|webp|heic|heif)/i.test(file.type)) return file;
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (scale === 1 && file.size < 1.5*1024*1024) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*scale); c.height = Math.round(bmp.height*scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/,'') + '.jpg', {type:'image/jpeg'});
  } catch(e){ return file; }
}
async function submitPhotos(form, fd, base){
  const files = fd.getAll('file').filter(f => f && f.size);
  const btn = form.querySelector('button[type=submit]'), status = form.querySelector('.upstatus'), bar = form.querySelector('.progress');
  if (!files.length) { toast('Choose at least one photo'); return; }
  btn.disabled = true; bar.hidden = false;
  const rows = [], failed = [];
  for (let i = 0; i < files.length; i++) {
    status.textContent = `Uploading photo ${i+1} of ${files.length}…`;
    bar.firstElementChild.style.width = Math.round((i / files.length) * 100) + '%';
    try {
      const small = await shrinkImage(files[i]);
      const path = await uploadFile(small, 'photo');
      const title = base.title ? (files.length > 1 ? `${base.title} (${i+1})` : base.title) : (base.album || 'Photo');
      rows.push({...base, title, media_path:path});
    } catch(e){ failed.push(files[i].name); console.warn(e); }
  }
  bar.firstElementChild.style.width = '100%';
  if (rows.length) {
    const { error } = await S.sb.from('de_content').insert(rows);
    if (error) { toast('Photos uploaded but could not be saved: ' + error.message); btn.disabled = false; return; }
  }
  status.textContent = `${rows.length} photo${rows.length===1?'':'s'} added to the gallery` + (failed.length ? ` · ${failed.length} failed: ${failed.slice(0,5).join(', ')}` : '');
  toast(`${rows.length} photo${rows.length===1?'':'s'} published`);
  form.querySelector('input[type=file]').value = '';
  btn.disabled = false; btn.innerHTML = `${ic('plus')}Publish`;
  setTimeout(()=>{ bar.hidden = true; }, 1500);
  await loadAll();
}
const COLS = ['title','speaker','date','series','scripture','duration','category','album','time','location','body','link'];
async function submitContent(form){
  const fd = new FormData(form), t = S.adminType, btn = form.querySelector('button[type=submit]');
  const row = {type:t};
  COLS.forEach(k => { const v = fd.get(k); if (typeof v === 'string' && v.trim()) row[k] = v.trim(); });
  const d = fd.get('desc'); if (typeof d === 'string' && d.trim()) row.description = d.trim();
  if (t==='weekly') row.day = +fd.get('day');
  if (!row.date && t!=='weekly') row.date = iso(new Date());
  if (t==='photo') { const base = {...row}; delete base.title; if (row.title) base.title = row.title; return submitPhotos(form, fd, base); }
  btn.disabled = true; btn.textContent = 'Publishing…';
  try {
    const file = fd.get('file'); if (file && file.size) row.media_path = await uploadFile(file, t, form.querySelector('.progress'));
    const poster = fd.get('poster'); if (poster && poster.size) row.poster_path = await uploadFile(poster, 'posters');
    const { error } = await S.sb.from('de_content').insert(row);
    if (error) throw new Error(error.message);
    toast(`${TYPE_LABEL[t]} published`);
    form.reset(); form.querySelector('.progress')?.setAttribute('hidden','');
    await loadAll();
  } catch(e){ toast(e.message || 'Could not publish — please try again'); console.warn(e); }
  btn.disabled = false; btn.innerHTML = `${ic('plus')}Publish`;
}
async function saveSettings(next){
  const { error } = await S.sb.from('de_settings').upsert({id:1, data:next, updated_at:new Date().toISOString()});
  if (error) throw new Error(error.message);
  S.settings = {...DEFAULT_SETTINGS, ...next};
}
async function submitSettings(form){
  const fd = new FormData(form), next = {...S.settings};
  for (const [k,v] of fd.entries()) if (typeof v === 'string') next[k] = v;
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    const ph = fd.get('pastorPhoto'); if (ph && ph.size) { const path = await uploadFile(ph, 'pastor'); next.pastorPhotoUrl = publicUrl(path); }
    await saveSettings(next); toast('Settings saved'); render();
  } catch(e){ toast(e.message || 'Could not save settings'); btn.disabled = false; }
}
async function adminDo(promise, okMsg){
  const { error } = await promise;
  if (error) { toast('Could not complete: ' + error.message); return; }
  if (okMsg) toast(okMsg);
  await loadAll();
}

/* ============================================================
   CLICK HANDLING
   ============================================================ */
function confirmTap(el, label='Tap again to confirm'){ if (el.dataset.confirm) return true; el.dataset.confirm = '1'; el.textContent = label; setTimeout(()=>{ if (el.isConnected) { delete el.dataset.confirm; render(); } }, 4000); return false; }
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a==='bg' && e.target !== el) return;
  switch (a) {
    case 'go': go(el.dataset.r); break;
    case 'more': openModal(`<div class="pad" style="padding-bottom:0"><h3>Menu</h3></div><div class="sheetgrid">${NAV.filter(n=>!n.g).concat([{id:'admin',label:S.canEdit?'Admin':'Admin sign-in',icon:'cog'}]).map(n=>`<a class="tile" href="#${n.id}"><span class="ic">${ic(n.icon)}</span>${n.label}</a>`).join('')}</div>`); break;
    case 'bg': case 'close': closeModal(); S._lb = null; break;
    case 'open': openItem(findItem(id)); break;
    case 'play': playAudio(findItem(id)); break;
    case 'stopaudio': document.getElementById('playerHost').innerHTML=''; S.playing=null; render(); break;
    case 'watchtab': S.watchTab = el.dataset.tab; if (route()!=='watch') { e.preventDefault(); go('watch'); } else render(); break;
    case 'series': S.watchSeries = el.dataset.v; render(); break;
    case 'lcat': S.listenCat = el.dataset.v; render(); break;
    case 'album': S.album = el.dataset.v; render(); break;
    case 'photo': showPhoto(+el.dataset.i); break;
    case 'lb': showPhoto(S._lb + (+el.dataset.d)); break;
    case 'copy': copyText(el.dataset.text); break;
    case 'testform': testimonyForm(); break;
    case 'cmonth': { const d=+el.dataset.d; S.calMonth = d===0 ? new Date(TODAY.getFullYear(),TODAY.getMonth(),1) : new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()+d, 1); if(d===0) S.calSel=iso(TODAY); render(); break; }
    case 'pmonth': S.progMonth = new Date(S.progMonth.getFullYear(), S.progMonth.getMonth()+(+el.dataset.d), 1); render(); break;
    case 'calday': S.calSel = el.dataset.d; render(); break;
    case 'prayed': {
      const was = !!S.prayedLocal[id];
      if (was) delete S.prayedLocal[id]; else S.prayedLocal[id] = true;
      saveLocal('prayed', S.prayedLocal);
      const p = S.prayers.find(x=>x.id===id);
      if (p && S.sb) { const r = await S.sb.rpc('de_pray', {pid:id, delta: was ? -1 : 1}); if (!r.error && typeof r.data === 'number') p.prayedCount = r.data; }
      if (!was) toast('Thank you for praying 🙏');
      render(); break;
    }
    case 'signout': e.preventDefault(); await S.sb.auth.signOut(); S.session=null; S.canEdit=false; go('home'); break;
    case 'atab': S.adminTab = el.dataset.v; render(); break;
    case 'atype': S.adminType = el.dataset.v; render(); break;
    case 'togglesamples': try { await saveSettings({...S.settings, hideSamples:!S.settings.hideSamples}); render(); } catch(err){ toast('Could not save'); } break;
    case 'delitem': if (confirmTap(el,'Tap again to delete')) { const it = S.dbItems.find(x=>x.id===id); const paths = [it&&it.media_path, it&&it.poster_path].filter(Boolean); if (paths.length) await S.sb.storage.from(BUCKET).remove(paths); await adminDo(S.sb.from('de_content').delete().eq('id', id), 'Deleted'); } break;
    case 'delprayer': if (confirmTap(el,'Confirm')) await adminDo(S.sb.from('de_prayers').delete().eq('id', id), 'Removed'); break;
    case 'deltest': if (confirmTap(el,'Confirm')) await adminDo(S.sb.from('de_testimonies').delete().eq('id', id), 'Removed'); break;
    case 'approve': await adminDo(S.sb.from('de_testimonies').update({approved:true}).eq('id', id), 'Testimony published'); break;
    case 'deladmin': if (confirmTap(el,'Remove?')) await adminDo(S.sb.from('de_admins').delete().eq('email', id), 'Admin removed'); break;
  }
});
document.addEventListener('submit', async e => {
  const form = e.target, f = form.dataset.form; if (!f) return; e.preventDefault();
  if (f==='prayer') submitPrayer(form);
  if (f==='testimony') submitTestimony(form);
  if (f==='content') submitContent(form);
  if (f==='settings') submitSettings(form);
  if (f==='admins') { const em = String(new FormData(form).get('email')||'').trim().toLowerCase(); if (em) await adminDo(S.sb.from('de_admins').insert({email:em}), 'Admin added'); }
  if (f==='signup') {
    const fd = new FormData(form), out = form.querySelector('#signupOut'), btn = form.querySelector('button'); btn.disabled = true; out.textContent = '';
    const email = String(fd.get('email')).trim().toLowerCase();
    const { data, error } = await S.sb.auth.signUp({email, password:String(fd.get('password')), options:{emailRedirectTo: location.origin + '/#admin'}});
    btn.disabled = false;
    if (error) { out.style.color = 'var(--rose)'; out.textContent = /registered|exists/i.test(error.message) ? 'This email already has an account — use Sign in above.' : error.message; return; }
    if (data.session) { await refreshAuth(); await loadAll(); return; }
    out.style.color = 'var(--green)'; out.textContent = 'Account created. Check your email for a confirmation link, then come back here and sign in.';
    return;
  }
  if (f==='signin') {
    const fd = new FormData(form), out = form.querySelector('#signinOut'), btn = form.querySelector('button'); btn.disabled = true; out.textContent = '';
    const { error } = await S.sb.auth.signInWithPassword({email:String(fd.get('email')).trim(), password:String(fd.get('password'))});
    btn.disabled = false;
    if (error) { out.textContent = error.message === 'Invalid login credentials' ? 'Email or password is incorrect.' : error.message; return; }
    await refreshAuth(); await loadAll();
  }
});

async function connect(){
  await refreshAuth();
  render();
  await loadAll();
  if (S.sb) S.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { S.session = null; S.canEdit = false; render(); } });
}

render();
connect();
</script>
